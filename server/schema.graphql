"""
Indicates that a field's position is semantically non-null: it is only null
when a matching entry exists in the `errors` array. Errors are not bubbled up
to the nearest nullable parent. See https://specs.apollo.dev/nullability/v0.4/

`levels` is zero-indexed: level 0 is the outermost type, level 1 is the inner
element of a list, and so on. `[0, 1]` covers both wrapper and items of a
`[T!]!` field.
"""
directive @semanticNonNull(levels: [Int!]! = [0]) on FIELD_DEFINITION

"""
Forces a field to resolve as an error. Tag a field selection inside a
query/fragment to make that one read error: the server inspects the
operation AST and throws when resolving the tagged field. The error
lands in `errors[]` at the field's path. Pair with `@semanticNonNull`
(or `@throwOnFieldError` on the operation) so the field nulls in place
rather than bubbling up.
"""
directive @simulateError on FIELD

interface Node {
  id: ID!
}

type PageInfo {
  hasNextPage: Boolean @semanticNonNull
  hasPreviousPage: Boolean @semanticNonNull
  startCursor: String
  endCursor: String
}

type Query {
  node(id: ID!): Node
  productTypeById(id: ID!): ProductType
  productById(id: ID!): Product
  sectorById(id: ID!): Sector
  productTypeBySlug(slug: String!): ProductType
  sectorBySlug(slug: String!): Sector
  productTypes(first: Int, after: String, last: Int, before: String): ProductTypeConnection
    @semanticNonNull
  sectors(first: Int, after: String, last: Int, before: String): SectorConnection @semanticNonNull
  "3D demo, see docs/data-driven-dependencies.md"
  productPage(slug: String!): ProductPage
  productPages: [ProductPage!]!
}

type Sector implements Node {
  id: ID!
  slug: String @semanticNonNull
  name: String @semanticNonNull
  productTypes(first: Int, after: String, last: Int, before: String): ProductTypeConnection
    @semanticNonNull
  products(first: Int, after: String, last: Int, before: String): ProductConnection @semanticNonNull
}

type ProductType implements Node {
  id: ID!
  slug: String @semanticNonNull
  name: String @semanticNonNull
  products(first: Int, after: String, last: Int, before: String): ProductConnection @semanticNonNull
  sectors(first: Int, after: String, last: Int, before: String): SectorConnection @semanticNonNull
}

type Product implements Node {
  id: ID!
  name: String @semanticNonNull
  description: String @semanticNonNull
  price: Float @semanticNonNull
  productType: ProductType @semanticNonNull
}

type ProductTypeConnection {
  edges: [ProductTypeEdge] @semanticNonNull(levels: [0, 1])
  pageInfo: PageInfo @semanticNonNull
}

type ProductTypeEdge {
  cursor: String @semanticNonNull
  node: ProductType @semanticNonNull
}

type ProductConnection {
  edges: [ProductEdge] @semanticNonNull(levels: [0, 1])
  pageInfo: PageInfo @semanticNonNull
}

type ProductEdge {
  cursor: String @semanticNonNull
  node: Product @semanticNonNull
}

type SectorConnection {
  edges: [SectorEdge] @semanticNonNull(levels: [0, 1])
  pageInfo: PageInfo @semanticNonNull
}

type SectorEdge {
  cursor: String @semanticNonNull
  node: Sector @semanticNonNull
}

# ---------------------------------------------------------------------------
# Data-Driven Dependencies (3D) demo
#
# See docs/data-driven-dependencies.md. A product page is assembled from a
# heterogeneous list of content blocks, an energy label that is usually null,
# and a price whose rendering strategy the server negotiates with the client.
# ---------------------------------------------------------------------------

"""
Opaque reference to a JS module. Only used by "Server 3D": the Relay compiler
asks for `js(module: "...")` on every concrete type spread with `@module` and
the server answers with the reference the client should load. The client-side
"compiler 3D" mode never selects this field.
"""
scalar JSDependency

type ProductPage {
  id: ID!
  slug: String!
  title: String!
  blocks: [ProductPageBlock!]!
  "Usually null: only a few products carry an energy label."
  energyLabel: EnergyLabel
  """
  Rendering strategy for the price. The client lists the strategies it can
  render in `supported` (Relay fills it in from the `@module` spreads under
  `@match`), and the server picks the best strategy from that list.
  """
  priceDisplay(supported: [String!]): PriceDisplay
}

union ProductPageBlock =
  | TextBlock
  | ImageGalleryBlock
  | VideoBlock
  | SpecsBlock
  | ReviewHighlightBlock
  | CarouselBlock
  | ComparisonBlock

type TextBlock {
  id: ID!
  heading: String!
  body: String!
  js(module: String!, id: String): JSDependency
}

type Image {
  url: String!
  alt: String!
}

type ImageGalleryBlock {
  id: ID!
  images: [Image!]!
  js(module: String!, id: String): JSDependency
}

type VideoBlock {
  id: ID!
  title: String!
  videoUrl: String!
  durationSeconds: Int!
  js(module: String!, id: String): JSDependency
}

type Spec {
  label: String!
  value: String!
}

type SpecsBlock {
  id: ID!
  specs: [Spec!]!
  js(module: String!, id: String): JSDependency
}

type ReviewHighlightBlock {
  id: ID!
  rating: Float!
  quote: String!
  author: String!
  js(module: String!, id: String): JSDependency
}

"A block that itself contains blocks: used to demonstrate nested 3D."
type CarouselBlock {
  id: ID!
  title: String!
  items: [ProductPageBlock!]!
  js(module: String!, id: String): JSDependency
}

"""
A block type that no client fragment spreads with @module. It shows what
happens when the server returns a union member the client doesn't know yet.
"""
type ComparisonBlock {
  id: ID!
  competitors: [String!]!
  js(module: String!, id: String): JSDependency
}

type EnergyLabel {
  id: ID!
  grade: String!
  kwhPerYear: Int!
  js(module: String!, id: String): JSDependency
}

union PriceDisplay = RegularPrice | SalePrice | BundlePrice

type RegularPrice {
  id: ID!
  amount: Float!
  js(module: String!, id: String): JSDependency
}

type SalePrice {
  id: ID!
  amount: Float!
  originalAmount: Float!
  endsAt: String!
  js(module: String!, id: String): JSDependency
}

type BundlePrice {
  id: ID!
  amount: Float!
  bundleItems: [String!]!
  js(module: String!, id: String): JSDependency
}
