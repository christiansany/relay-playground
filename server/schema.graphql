"""
Marks a field whose response should be replaced with `null` and surfaced as a
GraphQL error. Stripped from the query before it is sent to the server, then
applied client-side to the response. Dev only.
"""
directive @simulateError on FIELD

interface Node {
  id: ID!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Query {
  node(id: ID!): Node
  productTypeById(id: ID!): ProductType
  productById(id: ID!): Product
  sectorById(id: ID!): Sector
  productTypeBySlug(slug: String!): ProductType
  sectorBySlug(slug: String!): Sector
  productTypes(first: Int, after: String, last: Int, before: String): ProductTypeConnection!
  sectors(first: Int, after: String, last: Int, before: String): SectorConnection!
}

type Sector implements Node {
  id: ID!
  slug: String!
  name: String!
  productTypes(first: Int, after: String, last: Int, before: String): ProductTypeConnection!
}

type ProductType implements Node {
  id: ID!
  slug: String!
  name: String!
  products(first: Int, after: String, last: Int, before: String): ProductConnection!
  sectors(first: Int, after: String, last: Int, before: String): SectorConnection!
}

type Product implements Node {
  id: ID!
  name: String!
  description: String!
  price: Float!
  productType: ProductType!
}

type ProductTypeConnection {
  edges: [ProductTypeEdge!]!
  pageInfo: PageInfo!
}

type ProductTypeEdge {
  cursor: String!
  node: ProductType!
}

type ProductConnection {
  edges: [ProductEdge!]!
  pageInfo: PageInfo!
}

type ProductEdge {
  cursor: String!
  node: Product!
}

type SectorConnection {
  edges: [SectorEdge!]!
  pageInfo: PageInfo!
}

type SectorEdge {
  cursor: String!
  node: Sector!
}
